# PURPOSE: stores session-level facts that cannot be inferred from SP4/SP5
# frontmatter alone — inputs received, artifacts produced, continues_from links,
# gitignore status, dates. To be wired into the hub-generation script at the
# end of the current manual philology phase.
#
# WIRING INSTRUCTION (for future script integration):
#   - Script reads this file after generating hub stubs from frontmatter
#   - For each session key present here, OVERRIDE (not supplement) the
#     auto-generated fields with annotation data
#   - Fields not present in annotations are left as auto-generated
#   - See synthetic_nodes.yaml for the analogous pattern for graph nodes
#
# STATUS: crystallization artifact only — not yet wired into any script.
# GOVERNANCE: see CFP_5.3.16_Note_HubMetadataArchitectureDecisions.md — this file is
# the authoritative source for session topology; hub .md files are derived.
# Last updated: 2026-04-03 (SID-20260403-154700, hub architecture design session)

